<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фонкод Blitz 2026 — Платформа Блиц-Турниров</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="logo" onclick="goHome()" style="cursor:pointer;">
        <i class="fa-solid fa-bolt"></i>
        <span>ФОНКОД <span style="font-weight: 300; font-size: 0.9rem; color: var(--text-muted);">BLITZ 2026</span></span>
    </div>

    <nav class="nav-links">
        <button class="nav-btn" id="nav-home" onclick="goHome()">
            <i class="fa-solid fa-house"></i> Все блицы
        </button>
        <button class="nav-btn" id="nav-create" onclick="showCreate()" style="display:none;">
            <i class="fa-solid fa-plus"></i> Создать
        </button>
    </nav>

    <div class="header-actions">
        <div id="auth-header-area"></div>
    </div>
</header>

<main>

    <!-- ==================== HOME: список блицев ==================== -->
    <section id="view-home" class="view-screen active">
        <div class="empty-state" id="empty-blitzes">
            <i class="fa-solid fa-bolt"></i>
            <h2>Пока нет активных блицев</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                Создайте свой первый блиц и пригласите участников по ссылке
            </p>
            <button class="btn btn-primary" onclick="showCreate()">
                <i class="fa-solid fa-plus"></i> Создать блиц
            </button>
        </div>

        <div id="blitz-list-wrap" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h2>Активные блицы</h2>
                <button class="btn btn-primary" onclick="showCreate()">
                    <i class="fa-solid fa-plus"></i> Создать
                </button>
            </div>
            <div class="blitz-list" id="blitz-list"></div>
        </div>
    </section>

    <!-- ==================== CREATE ==================== -->
    <section id="view-create" class="view-screen">
        <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-plus-circle"></i> Создание блица</h2>
            <form onsubmit="createBlitz(event)">
                <div class="form-group">
                    <label>Название турнира</label>
                    <input type="text" id="create-title" class="form-control" required placeholder="Например: Кубок Весны 2026">
                </div>
                <div class="form-group">
                    <label>Количество задач</label>
                    <select id="create-problems" class="form-control">
                        <option value="3">3 задачи</option>
                        <option value="5" selected>5 задач</option>
                        <option value="7">7 задач</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Длительность</label>
                    <select id="create-duration" class="form-control">
                        <option value="10">10 минут</option>
                        <option value="20" selected>20 минут</option>
                        <option value="30">30 минут</option>
                        <option value="60">60 минут</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Максимум участников</label>
                    <input type="number" id="create-max" class="form-control" value="8" min="2" max="32">
                </div>
                <div style="display:flex; gap:0.5rem; margin-top:1.5rem;">
                    <button type="button" class="btn btn-secondary" style="flex:1;" onclick="goHome()">Отмена</button>
                    <button type="submit" class="btn btn-primary" style="flex:2;">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Создать и получить ссылку
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- ==================== BLITZ ==================== -->
    <section id="view-blitz" class="view-screen">
        <div id="blitz-content"></div>
    </section>

</main>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
    <div class="glass-card modal-content">
        <div class="modal-header">
            <h3 id="modal-title">Вход в систему</h3>
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
        </div>
        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="auth-username" class="form-control" placeholder="Ваш ник" required minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="auth-password" class="form-control" placeholder="Минимум 4 символа" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="auth-submit-btn">Войти</button>
        </form>
        <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
            <span id="auth-switch-text">Нет аккаунта?</span>
            <a href="#" id="auth-switch-link" style="color: var(--p1-color); font-weight: 600;" onclick="toggleAuthMode(event)">Зарегистрироваться</a>
        </div>
    </div>
</div>

<!-- INVITE MODAL -->
<div class="modal-overlay" id="invite-modal">
    <div class="glass-card modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-link" style="color: var(--success-green);"></i> Блиц создан!</h3>
            <button class="close-btn" onclick="closeInviteModal()">&times;</button>
        </div>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">
            Отправьте эту ссылку участникам, чтобы они присоединились:
        </p>
        <div class="invite-box">
            <input type="text" id="invite-link-input" class="form-control" readonly>
            <button class="btn btn-secondary" onclick="copyInviteLink()">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="closeInviteModal()">
            Перейти в блиц
        </button>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
<script src="script.js"></script>

</body>
</html>
